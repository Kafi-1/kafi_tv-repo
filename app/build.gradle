plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.tvbykafi.app'
    compileSdk 34

    // Legacy flavor = Android 4.4.4 / API 19 TV support (ExoPlayer 2.x)
    // Modern flavor = current production build (Media3), unchanged
    flavorDimensions "api"
    productFlavors {
        modern {
            dimension "api"
            minSdk 21
        }
        legacy {
            dimension "api"
            minSdk 19
            versionNameSuffix "-legacy"
            proguardFile 'proguard-legacy.pro'
        }
    }

    defaultConfig {
        applicationId "com.tvbykafi.app"
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            // GitHub Actions e KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
            // env variable diyele notun keystore use hobe
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile != null && file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
                // v1 = purono Android TV box (4.4/5-6), v2 = notun box
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Keystore na thakle debug key diye sign hoy (v1+v2 auto on),
            // jate APK kokhono unsigned na thake
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            minifyEnabled false
        }
    }

    // Legacy APK er naam alada kore dile jate TV te install korar somoy
    // modern build er sathe confusion na hoy
    applicationVariants.all { variant ->
        if (variant.flavorName == "legacy") {
            variant.outputs.all { output ->
                outputFileName = variant.buildType.name == "release"
                        ? "Kafi TV Legacy.apk"
                        : "Kafi TV Legacy-debug.apk"
            }
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin', 'kotlin/**']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // Material Design
    implementation 'com.google.android.material:material:1.11.0'

    // Multidex (API 19 e legacy multidex lagbe)
    implementation 'androidx.multidex:multidex:2.0.1'

    // ExoPlayer — Modern flavor (Media3, API 21+)
    modernImplementation 'androidx.media3:media3-exoplayer:1.2.1'
    modernImplementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    modernImplementation 'androidx.media3:media3-exoplayer-dash:1.2.1'
    modernImplementation 'androidx.media3:media3-exoplayer-rtsp:1.2.1'
    modernImplementation 'androidx.media3:media3-ui:1.2.1'

    // ExoPlayer 2.x — Legacy flavor (Android 4.4 / API 19 compatible, minSdk 16)
    legacyImplementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    legacyImplementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    legacyImplementation 'com.google.android.exoplayer:exoplayer-dash:2.19.1'
    legacyImplementation 'com.google.android.exoplayer:exoplayer-rtsp:2.19.1'
    legacyImplementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.1')
    implementation 'com.google.firebase:firebase-firestore-ktx'

    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    // Lifecycle (lifecycleScope)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
