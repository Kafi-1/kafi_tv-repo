name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Modern Debug APK
        run: ./gradlew assembleModernDebug --no-daemon --stacktrace

      - name: Build Modern Release APK
        run: ./gradlew assembleModernRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Build Legacy Release APK (Android 4.4 / API 19)
        run: ./gradlew assembleLegacyRelease --no-daemon --stacktrace

      - name: Upload Modern Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TVbyKafi-debug
          path: app/build/outputs/apk/modern/debug/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Modern Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TVbyKafi-release
          path: app/build/outputs/apk/modern/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Kafi TV Legacy APK (Android 4.4)
        uses: actions/upload-artifact@v4
        with:
          name: Kafi-TV-Legacy
          path: app/build/outputs/apk/legacy/release/*.apk
          retention-days: 30
          if-no-files-found: error
